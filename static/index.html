<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="12" stroke="#FF3B69" stroke-width="2"/>
        <path d="M16 4 C 25 4 25 28 16 28" stroke="#FF3B69" stroke-width="2" fill="none"/>
        <circle cx="16" cy="16" r="2.6" fill="#FF3B69"/>
      </svg>
      <div class="brand-text">
        <span class="brand-word">MERIDIAN</span>
        <span class="brand-sub">Workspace Assistant</span>
      </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="sidebar-heading">Recent</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <div class="sim-tag"><span class="sim-dot"></span> Simulated inference — demo mode</div>
      <div class="tenant-chip">
        <div class="tenant-avatar" id="tenantAvatar">…</div>
        <div class="tenant-info">
          <div class="tenant-name" id="tenantName">Loading…</div>
          <div class="tenant-role" id="tenantHost">Env: …</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle chat history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="topbar-title" id="topbarTitle">New chat</span>
      <span class="topbar-host" id="topbarHost">…</span>
      <div class="gpu-rail-wrap">
        <div class="gpu-status">
          <div class="gpu-status-line" id="gpuStatusLine">Idle</div>
          <div class="gpu-status-sub" id="gpuStatusSub">Detecting GPUs…</div>
        </div>
        <div class="gpu-rail" id="gpuRail"></div>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer-inner">
        <div class="chip-row" id="chipRow"></div>
        <div class="composer-box">
          <textarea id="composerInput" rows="1" placeholder="Ask Meridian anything…"></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="composer-foot">
          <span>Meridian · mock responses, no model is actually called</span>
          <span id="tenantFootTag">Tenant: … · Env: …</span>
        </div>
      </div>
    </div>
  </main>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
